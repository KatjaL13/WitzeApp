<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (error) {}
    </script>
    <link rel="stylesheet" href="styles/main.scss" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WitzeApp</title>
  </head>
  <body>
    <div id="app">
      <h1 class="header">Witze App</h1>
      <button class="theme-toggle" type="button" title="Light Mode" aria-label="Zum Light Mode wechseln" aria-pressed="true">
        <span class="theme-toggle__icon" aria-hidden="true">☀️</span>
      </button>
      <div class="joke">
        <p class="joke__text">
          <em>Klicke auf den Button für einen Witz.</em>
        </p>
        <div class="joke__action">
          <button class="joke__new">Neuen Witz laden</button>
          <button class="joke__save joke__save--unvisible">
            <span>Witz speichern</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="joke__saveIcon">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" />
            </svg>
          </button>
        </div>
      </div>
      <div class="savedJokes">
        <h2 class="header header__savedJokes">Gespeicherte Witze</h2>
        <div class="savedJokes__list"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
